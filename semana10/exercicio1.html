<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- 1. META TAG VIEWPORT: Essencial para desativar o zoom automático do mobile -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo Mobile First</title>

  <style>
    /* Reset básico usando a regra de box-sizing */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 2. UNIDADES RELATIVAS (rem, %, vh): 
       Definimos o font-size base no root ou body. 1rem = 16px por padrão. */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: #1f2937;
      background-color: #f3f4f6;
      padding: 1rem;
    }

    /* Container do Card */
    .card {
      background-color: #ffffff;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 56rem; /* Limitador para telas ultralargas */
      margin: 0 auto;

      /* 3. FLEXBOX (MOBILE FIRST = COLUMN Por padrão) */
      display: flex;
      flex-direction: column; 
      gap: 1.5rem;
    }

    /* Visualização da Mídia */
    .card-media {
      width: 100%;
    }

    /* 4. IMAGEM FLEXÍVEL / RESPONSIVA:
       width: 100% e max-width garantem que a imagem se ajuste sem estourar o container */
    .card-image {
      width: 100%;
      height: 100%;
      max-width: 100%;
      object-fit: cover;
      display: block;
    }

    /* Conteúdo Textual */
    .card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
    }

    .card-title {
      font-size: 1.5rem; /* 24px relativo */
      color: #111827;
    }

    .card-description {
      font-size: 1rem;
      color: #4b5563;
    }

    .card-button {
      align-self: flex-start;
      padding: 0.75rem 1.5rem;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 5. MEDIA QUERIES (BREAKPOINT DE DESKTOP)
       min-width: 768px -> Aplica as regras apenas a partir desse limite */
    @media (min-width: 768px) {
      .card {
        /* Transição de COLUMN para ROW em telas maiores */
        flex-direction: row;
      }

      .card-media {
        /* Divide o espaço igualmente entre a imagem e o texto */
        flex: 1;
      }

      .card-content {
        flex: 1;
        padding: 2.5rem;
      }

      .card-title {
        font-size: 2rem; /* Aumenta a tipografia proporcionalmente */
      }
    }
  </style>
</head>
<body>

  <article class="card">
    <div class="card-media">
      <img 
        src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=800&q=80" 
        alt="Workspace com notebook" 
        class="card-image"
      >
    </div>
    
    <div class="card-content">
      <h2 class="card-title">Desenvolvimento Mobile First</h2>
      <p class="card-description">
        Construir layouts pensando primeiro nas telas menores garante um código mais limpo, leve e focado no essencial antes de expandir para resoluções maiores.
      </p>
      <button class="card-button">Saiba mais</button>
    </div>
  </article>

</body>
</html>
