<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Requisito 2: Título da página -->
  <title>Inscrição no Workshop de Desenvolvimento Mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>Inscrição no Workshop de Desenvolvimento Mobile</h1>
    </header>

    <!-- Requisito 3: Formulário -->
    <form action="#" method="post">
      
      <fieldset>
        <legend>Dados Pessoais</legend>

        <!-- Requisito 4 e 7 e 8: text + label associado + required -->
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" required>
        </div>

        <div class="form-row">
          <!-- Requisito 4 e 7 e 8: email + label associado + required -->
          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
          </div>

          <!-- Requisito 4 e 7 e 8: password + label associado + required -->
          <div class="form-group">
            <label for="senha">Senha de Acesso</label>
            <input type="password" id="senha" name="senha" required>
          </div>
        </div>

        <div class="form-row">
          <!-- Requisito 4 e 7 e 8: number + label associado + required -->
          <div class="form-group">
            <label for="idade">Idade</label>
            <input type="number" id="idade" name="idade" min="1" required>
          </div>

          <!-- Requisito 4 e 7 e 8: date + label associado + required -->
          <div class="form-group">
            <label for="data-nascimento">Data de Nascimento</label>
            <input type="date" id="data-nascimento" name="data_nascimento" required>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Perfil Técnico e Preferências</legend>

        <!-- Requisito 4 e 8: radio para nível + required -->
        <div class="form-group">
          <label>Nível de Conhecimento em Programação</label>
          <div class="options-group">
            <label class="option-item">
              <input type="radio" name="nivel" value="iniciante" required> Iniciante
            </label>
            <label class="option-item">
              <input type="radio" name="nivel" value="intermediario"> Intermediário
            </label>
            <label class="option-item">
              <input type="radio" name="nivel" value="avancado"> Avançado
            </label>
          </div>
        </div>

        <!-- Requisito 5 e 8: select para a trilha + required -->
        <div class="form-group">
          <label for="trilha">Trilha do Workshop</label>
          <select id="trilha" name="trilha" required>
            <option value="" disabled selected>Selecione uma trilha...</option>
            <option value="ios">Desenvolvimento iOS</option>
            <option value="android">Desenvolvimento Android</option>
            <option value="crossplatform">Desenvolvimento Multiplataforma</option>
          </select>
        </div>

        <!-- Requisito 4: checkbox para temas de interesse -->
        <div class="form-group">
          <label>Temas de Interesse</label>
          <div class="options-group">
            <label class="option-item">
              <input type="checkbox" name="temas" value="ui-ux"> Interface e Layout (UI/UX)
            </label>
            <label class="option-item">
              <input type="checkbox" name="temas" value="api"> Integração com APIs
            </label>
            <label class="option-item">
              <input type="checkbox" name="temas" value="banco-dados"> Banco de Dados Mobile
            </label>
          </div>
        </div>

        <!-- Requisito 6 e 7: textarea + label associado -->
        <div class="form-group">
          <label for="apresentacao">Apresentação Pessoal ou Observações</label>
          <textarea id="apresentacao" name="apresentacao" placeholder="Fale um pouco sobre você..."></textarea>
        </div>
      </fieldset>

      <!-- Requisito 4: submit -->
      <input type="submit" value="Enviar Inscrição">

    </form>
  </div>

</body>
</html>
